<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Betwixt — You've got neighbors. Now meet ours.</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="homepage.css" />
  <link rel="stylesheet" href="character.css" />
  <link rel="icon" type="image/svg+xml" href="../../assets/logo-icon-primary.svg" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="image-slot.js"></script>
  <script src="data.js"></script>
</head>
<body class="bw-root">
  <div id="root"></div>

  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="NeighborhoodGrid.jsx"></script>
  <script type="text/babel" src="FeaturedHood.jsx"></script>
  <script type="text/babel" src="Callout.jsx"></script>
  <script type="text/babel" src="CharacterDetail.jsx"></script>
  <script type="text/babel" src="Neighborhood.jsx"></script>
  <script type="text/babel" src="About.jsx"></script>
  <script type="text/babel" src="Visit.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function parseHash() {
      const h = (location.hash || '#home').replace('#','');
      const [route, id] = h.split('/');
      return { route, id };
    }

    function App() {
      const [{ route, id }, setState] = useState(parseHash());

      const navigate = (route, id) => {
        const h = id ? `${route}/${id}` : route;
        history.replaceState(null, '', '#' + h);
        setState({ route, id });
        window.scrollTo({ top: 0, behavior: 'instant' });
      };
      const setRoute = (r) => navigate(r);
      const openCharacter = (cid) => navigate('character', cid);
      const openNeighborhood = (nid) => navigate('neighborhood', nid);

      useEffect(() => {
        const onHash = () => setState(parseHash());
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      return (
        <>
          <Header route={route} setRoute={setRoute} />
          <main data-screen-label={`Route · ${route}${id ? ' · ' + id : ''}`}>
            {route === 'home' && (
              <>
                <Hero setRoute={setRoute} />
                <FeaturedHood setRoute={setRoute} />
                <NeighborhoodGrid
                  setRoute={setRoute}
                  openCharacter={openCharacter}
                />
                <Callout setRoute={setRoute} />
                <FieldNotes />
              </>
            )}
            {route === 'character' && (
              <CharacterDetail
                setRoute={setRoute}
                characterId={id || 'zaman'}
              />
            )}
            {route === 'neighborhood' && (
              <Neighborhood
                setRoute={setRoute}
                openCharacter={openCharacter}
                neighborhoodId={id || 'intangibles'}
              />
            )}
            {route === 'about' && <About />}
            {route === 'notes' && <FieldNotes />}
            {route === 'visit' && <Visit setRoute={setRoute} />}
          </main>
          <Footer setRoute={setRoute} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
