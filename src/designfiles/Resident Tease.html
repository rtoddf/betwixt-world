<!doctype html>
<!-- @dsCard group="Brand" name="Resident Tease" subtitle="Three directions — Zaman, home-page collectible" viewport="1280x800" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Betwixt — Resident Tease</title>
<link rel="stylesheet" href="resident-tease/colors_and_type.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); }

  /* ============ shared collectible-card vocabulary ============ */
  .tease {
    box-sizing: border-box;
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    position: relative;
    user-select: none;
  }
  .tease * { box-sizing: border-box; }

  .mono {
    font-family: ui-monospace, Menlo, monospace;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 10px;
    font-weight: 500;
  }
  .stamp { width: 34px; height: 34px; display: block; }

  /* concept "type" badge — Pokémon-ish pill */
  .typebadge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--bw-amber);
    color: var(--bw-navy);
    border: 1.5px solid var(--bw-navy);
    border-radius: var(--r-pill);
    padding: 4px 12px 4px 9px;
    font-weight: 700;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    box-shadow: 0 2px 0 var(--bw-navy);
  }
  .typebadge .inf { font-size: 16px; line-height: 1; margin-top: -2px; }

  /* dot-pip stat rows */
  .traits { display: flex; flex-direction: column; gap: 9px; }
  .trait { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .trait .lbl { font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em; }
  .pips { display: inline-flex; gap: 5px; }
  .pip {
    width: 11px; height: 11px; border-radius: 50%;
    border: 1.5px solid var(--pip-ink, var(--bw-navy));
    background: transparent;
  }
  .pip.on { background: var(--pip-on, var(--bw-burnt)); }

  .verseline { font-style: italic; line-height: 1.4; }

  /* ===================================================================
     A — FIELD CARD  (cream, trading-card classic)
     =================================================================== */
  .A {
    width: 340px;
    background: var(--bg-elevated);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-inset), 0 6px 0 var(--bw-navy), 0 18px 30px rgba(26,74,74,.14);
    padding: 14px;
    transform: rotate(-1.1deg);
  }
  .A .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .A .num { color: var(--fg-muted); }
  .A .window {
    position: relative; border-radius: var(--r);
    overflow: hidden; aspect-ratio: 1 / 1;
    border: 1.5px solid var(--bw-navy);
    background: var(--bw-amber-tint);
  }
  .A .rect { position: absolute; border-radius: 4px; }
  .A .rect.back  { inset: 8% 24% 0 6%;  background: #E89568; transform: rotate(-3.4deg); transform-origin: 50% 100%; }
  .A .rect.front { inset: 2% 6% 0 22%;  background: #D67042; transform: rotate(2.8deg);  transform-origin: 50% 100%; }
  .A .ghost {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--font-display); font-size: 150px; color: rgba(240,165,0,.55);
    pointer-events: none; line-height: 1;
  }
  .A image-slot {
    position: absolute; left: 50%; top: 54%; transform: translate(-50%,-50%);
    width: 78%; height: 78%;
  }
  .A .typewrap { display: flex; justify-content: center; margin: -16px 0 6px; position: relative; z-index: 2; }
  .A .name {
    font-family: var(--font-display); font-weight: 400;
    font-size: 44px; line-height: .9; letter-spacing: .03em;
    color: var(--fg-display); margin: 8px 0 2px; text-align: center;
  }
  .A .pron { text-align: center; color: var(--fg-muted); margin-bottom: 8px; }
  .A .hood { text-align: center; color: var(--bw-burnt); margin-bottom: 10px; }
  .A .well {
    background: var(--bw-cream-deep);
    border: 1.5px solid var(--border-soft);
    border-radius: var(--r); padding: 12px 14px;
  }
  .A .verseline { color: var(--fg); font-size: 13.5px; text-align: center; margin-bottom: 12px; }
  .A .traits { --pip-on: var(--bw-burnt); }

  /* ===================================================================
     B — TEAL STICKER  (Panini die-cut, bold)
     =================================================================== */
  .B-wrap { transform: rotate(1.6deg); }
  .B {
    width: 332px;
    background: var(--bw-teal);
    border-radius: 26px;
    /* die-cut white keyline */
    box-shadow: 0 0 0 7px var(--bg-elevated), 0 0 0 9px var(--bw-navy), 0 10px 0 1px rgba(26,74,74,.30), 0 20px 34px rgba(26,74,74,.22);
    padding: 16px 18px 18px;
    color: var(--fg-inverse);
  }
  .B .head { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 6px; }
  .B .num { color: rgba(245,237,214,.62); }
  .B .halo { position: relative; height: 172px; display: grid; place-items: center; margin: 2px 0 6px; }
  .B .halo::before {
    content: ""; position: absolute; width: 168px; height: 168px; border-radius: 50%;
    background: radial-gradient(circle, rgba(240,165,0,.55) 0%, rgba(240,165,0,0) 70%);
  }
  .B .disc {
    position: relative; width: 150px; height: 150px; border-radius: 50%;
    border: 4px solid var(--bg-elevated);
    box-shadow: 0 0 0 1.5px var(--bw-navy), inset 0 0 0 1.5px var(--bw-navy);
    overflow: hidden; background: var(--bw-amber-tint);
  }
  .B image-slot { width: 100%; height: 100%; }
  .B .typewrap { display: flex; justify-content: center; margin: -2px 0 4px; }
  .B .name {
    font-family: var(--font-display); font-weight: 400;
    font-size: 46px; line-height: .9; letter-spacing: .03em;
    color: var(--fg-inverse); text-align: center; margin: 8px 0 2px;
  }
  .B .hood { text-align: center; color: var(--bw-amber); margin-bottom: 10px; }
  .B .verseline { text-align: center; color: rgba(245,237,214,.92); font-size: 13px; margin: 0 4px 12px; }

  /* ----- B cream colorway (Medallion scheme — color only, same silhouette) ----- */
  .B.cream {
    background: var(--bg-elevated); color: var(--fg);
    box-shadow:
      0 0 0 8px var(--bw-burnt),
      0 0 0 11px var(--bw-teal),
      0 13px 0 1px rgba(26,74,74,.16),
      0 22px 34px rgba(26,74,74,.18);
  }
  .B.cream .num { color: var(--fg-muted); }
  .B.cream .disc { border-color: var(--bw-teal); }
  .B.cream .name { color: var(--fg-display); }
  .B.cream .hood { color: var(--bw-burnt); }
  .B.cream .verseline { color: var(--fg); }

  .traits-h { font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="resident-tease/image-slot.js"></script>
<script type="text/babel" src="resident-tease/design-canvas.jsx"></script>

<script type="text/babel">
const { useState } = React;

const ZAMAN = {
  num: "06",
  name: "Zaman",
  pron: "ZAH-mahn",
  concept: "Time",
  glyph: "\u221E",
  hood: "The Intangibles",
  placename: "INTANGIMERE",
  verseLine: "Cause he never learned how to tell time.",
  stats: [
    ["Presence", 5],
    ["Patience", 5],
    ["Stillness", 4],
    ["Punctuality", 1],
    ["Hurry", 0],
  ],
};

const Stamp = () => (
  <img className="stamp" src="resident-tease/assets/logo-icon-primary.svg" alt="Betwixt" draggable="false" />
);

const TypeBadge = () => (
  <span className="typebadge"><span className="inf">{ZAMAN.glyph}</span>{ZAMAN.concept}</span>
);

function Pips({ n, max = 5 }) {
  return (
    <span className="pips">
      {Array.from({ length: max }).map((_, i) => (
        <span key={i} className={"pip" + (i < n ? " on" : "")}></span>
      ))}
    </span>
  );
}

function Traits({ heading }) {
  return (
    <div>
      {heading !== false && <div className="mono traits-h">{heading || "Traits"}</div>}
      <div className="traits">
        {ZAMAN.stats.map(([lbl, n]) => (
          <div className="trait" key={lbl}>
            <span className="lbl">{lbl}</span>
            <Pips n={n} />
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------- A — FIELD CARD ---------- */
function CardA() {
  return (
    <div className="tease A">
      <div className="head">
        <span className="mono num">No. {ZAMAN.num}</span>
        <Stamp />
      </div>
      <div className="window">
        <span className="rect back"></span>
        <span className="rect front"></span>
        <div className="ghost">{ZAMAN.glyph}</div>
        <image-slot id="zaman-a" shape="rounded" radius="10" placeholder="drop headshot"></image-slot>
      </div>
      <div className="typewrap" style={{ marginTop: "-16px" }}><TypeBadge /></div>
      <div className="name">{ZAMAN.name}</div>
      <div className="mono pron">/ {ZAMAN.pron} /</div>
      <div className="mono hood">{ZAMAN.hood}</div>
      <div className="well">
        <div className="verseline">"{ZAMAN.verseLine}"</div>
        <Traits />
      </div>
    </div>
  );
}

/* ---------- B — STICKER (teal + cream colorways, no stats) ---------- */
function CardB({ variant = "teal" }) {
  return (
    <div className="B-wrap">
      <div className={"tease B" + (variant === "cream" ? " cream" : "")}>
        <div className="head">
          <Stamp />
        </div>
        <div className="halo">
          <div className="disc">
            <image-slot id={"zaman-b-" + variant} shape="circle" placeholder="drop headshot"></image-slot>
          </div>
        </div>
        <div className="typewrap"><TypeBadge /></div>
        <div className="name">{ZAMAN.name}</div>
        <div className="mono hood">{ZAMAN.hood}</div>
        <div className="verseline">"{ZAMAN.verseLine}"</div>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="resident-tease" title="Resident Tease — Zaman" subtitle="Home-page collectible · sticker in two colorways · Field Card parked">
        <DCArtboard id="A" label="A · Field Card" width={368} height={704}>
          <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center" }}><CardA /></div>
        </DCArtboard>
        <DCArtboard id="B" label="Sticker · Teal" width={400} height={492}>
          <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center" }}><CardB variant="teal" /></div>
        </DCArtboard>
        <DCArtboard id="Bc" label="Sticker · Cream" width={400} height={492}>
          <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center" }}><CardB variant="cream" /></div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
