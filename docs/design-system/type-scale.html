<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Type — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 20px 28px; box-sizing: border-box; }
  .stack { display: grid; gap: 6px; grid-template-columns: 64px 80px 1fr; align-items: baseline; }
  .label { font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--fg-muted); letter-spacing: 0.18em; text-transform: uppercase; }
  .px    { font-family: var(--font-body); font-size: 12px; color: var(--fg-muted); }
  .h1 { font-family: var(--font-display); font-size: 48px; line-height: 1.05; letter-spacing: 0.06em; color: var(--fg-display); }
  .h2 { font-family: var(--font-display); font-size: 36px; line-height: 1.1;  letter-spacing: 0.06em; color: var(--fg-display); }
  .h3 { font-family: var(--font-display); font-size: 24px; line-height: 1.2;  letter-spacing: 0.05em; color: var(--fg); }
  .b  { font-family: var(--font-body);    font-size: 16px; line-height: 1.55; color: var(--fg); font-weight: 500; }
  .s  { font-family: var(--font-body);    font-size: 14px; line-height: 1.5;  color: var(--fg-muted); font-weight: 500; }
</style>
</head>
<body>
  <div class="stack">
    <div class="label">H1</div><div class="px">48 / 1.05</div><div class="h1">Meet our neighbors</div>
    <div class="label">H2</div><div class="px">36 / 1.10</div><div class="h2">Meet our neighbors</div>
    <div class="label">H3</div><div class="px">24 / 1.20</div><div class="h3">Meet our neighbors</div>
    <div class="label">Body</div><div class="px">16 / 1.55</div><div class="b">Meet our neighbors — the kids of feelings, conditions, and the things humans make.</div>
    <div class="label">Small</div><div class="px">14 / 1.50</div><div class="s">A note from the studio · 3 min read · Updated yesterday</div>
  </div>
</body>
</html>
