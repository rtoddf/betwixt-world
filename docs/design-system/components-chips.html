<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Components — Chips &amp; Tags</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 22px 24px; box-sizing: border-box; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; line-height: 1; }
  .chip.solid    { background: #2A7F7F; color: #F5EDD6; }
  .chip.outline  { background: transparent; color: #1A4A4A; box-shadow: inset 0 0 0 1.5px #1A4A4A; }
  .chip.amber    { background: #FAE4B8; color: #1A4A4A; box-shadow: inset 0 0 0 1.5px #F0A500; }
  .chip.coral    { background: #E8442A; color: #F5EDD6; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .85; }
  .eyebrow { font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: 0.2em; color: #D4622A; text-transform: uppercase; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="eyebrow">Field Notes</div>
  <div class="row">
    <span class="chip solid"><span class="dot"></span>Resident</span>
    <span class="chip outline">Newcomer</span>
    <span class="chip amber">Visiting</span>
    <span class="chip coral">Featured</span>
    <span class="chip outline">Issue 04</span>
    <span class="chip outline">3 min read</span>
  </div>
</body>
</html>
