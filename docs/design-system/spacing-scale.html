<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spacing — Scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 18px 24px; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: 56px 60px 1fr; gap: 14px; align-items: center; margin-bottom: 7px; }
  .tok { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--fg-muted); }
  .px  { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--fg); font-weight: 600; }
  .bar { height: 14px; background: #2A7F7F; border-radius: 3px; box-shadow: inset 0 0 0 1.5px #1A4A4A; }
</style>
</head>
<body>
  <div class="row"><div class="tok">--s-1</div><div class="px">4px</div><div class="bar" style="width:4px;"></div></div>
  <div class="row"><div class="tok">--s-2</div><div class="px">8px</div><div class="bar" style="width:8px;"></div></div>
  <div class="row"><div class="tok">--s-3</div><div class="px">12px</div><div class="bar" style="width:12px;"></div></div>
  <div class="row"><div class="tok">--s-4</div><div class="px">16px</div><div class="bar" style="width:16px;"></div></div>
  <div class="row"><div class="tok">--s-5</div><div class="px">24px</div><div class="bar" style="width:24px;"></div></div>
  <div class="row"><div class="tok">--s-6</div><div class="px">32px</div><div class="bar" style="width:32px;"></div></div>
  <div class="row"><div class="tok">--s-7</div><div class="px">48px</div><div class="bar" style="width:48px;"></div></div>
  <div class="row"><div class="tok">--s-8</div><div class="px">64px</div><div class="bar" style="width:64px;"></div></div>
  <div class="row"><div class="tok">--s-9</div><div class="px">96px</div><div class="bar" style="width:96px;"></div></div>
  <div class="row"><div class="tok">--s-10</div><div class="px">128px</div><div class="bar" style="width:128px;"></div></div>
</body>
</html>
