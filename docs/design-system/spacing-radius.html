<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spacing — Radius</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 24px; box-sizing: border-box; }
  .row { display: flex; gap: 22px; align-items: center; }
  .box { width: 92px; height: 92px; background: #F0A500; box-shadow: inset 0 0 0 1.5px #1A4A4A; display: grid; place-items: end center; padding-bottom: 8px; }
  .lbl { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #1A4A4A; font-weight: 700; }
  .cap { font-size: 12px; color: var(--fg-muted); margin-top: 6px; text-align: center; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .note { margin-left: auto; font-size: 13px; color: var(--fg-muted); max-width: 220px; line-height: 1.5; }
  .note b { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.04em; color: var(--fg); font-weight: 400; display: block; margin-bottom: 4px; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:4px"><span class="lbl">4</span></div><div class="cap">--r-sm</div></div>
    <div class="col"><div class="box" style="border-radius:12px"><span class="lbl">12</span></div><div class="cap">--r · house</div></div>
    <div class="col"><div class="box" style="border-radius:20px"><span class="lbl">20</span></div><div class="cap">--r-lg</div></div>
    <div class="col"><div class="box" style="border-radius:999px"><span class="lbl">∞</span></div><div class="cap">--r-pill</div></div>
    <div class="note"><b>12px is the house corner.</b> Buttons, inputs, cards. The pill is only for chips. Perfect circles belong to the logo mark.</div>
  </div>
</body>
</html>
