<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Colors — Secondary</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 22px 24px; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .swatch { border-radius: 8px; box-shadow: var(--sh-inset); overflow: hidden; }
  .chip { height: 96px; }
  .label { padding: 10px 14px 12px; background: var(--bg-elevated); }
  .name { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.05em; color: var(--fg); }
  .hex { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--fg-muted); margin-top: 2px; }
  .role { font-size: 12px; color: var(--fg-muted); margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#1A4A4A"></div><div class="label"><div class="name">Deep Navy</div><div class="hex">#1A4A4A</div><div class="role">Body workhorse · all body copy on cream · ink lines</div></div></div>
    <div class="swatch"><div class="chip" style="background:#F5EDD6"></div><div class="label"><div class="name">Cream</div><div class="hex">#F5EDD6</div><div class="role">Background, always · never pure white</div></div></div>
    <div class="swatch"><div class="chip" style="background:#E8442A"></div><div class="label"><div class="name">Coral</div><div class="hex">#E8442A</div><div class="role">Pop moments · large display text on cream only</div></div></div>
  </div>
</body>
</html>
