<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spacing — Motion</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 22px 24px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 28px; align-items: center; }
  .row { display: flex; align-items: center; gap: 14px; }
  .label { font-family: var(--font-display); font-size: 17px; letter-spacing: 0.04em; color: var(--fg); width: 160px; }
  .meta  { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-muted); }
  .demo  { flex: 1; height: 28px; position: relative; overflow: hidden; border-radius: 999px; background: #ECDFB8; box-shadow: inset 0 0 0 1px rgba(26,74,74,.18); }
  .ball  { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #2A7F7F; box-shadow: 0 2px 0 #1A4A4A; animation-duration: 1.4s; animation-iteration-count: infinite; animation-direction: alternate; }
  .b1 { animation-name: slide; animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1); }
  .b2 { animation-name: slide; animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); background: #E8442A; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(calc(100% + 60px)); } }
  .row.row-r { display: block; }
  .cap { font-size: 13px; color: var(--fg-muted); line-height: 1.5; }
  .cap b { font-family: var(--font-display); color: var(--fg); font-size: 16px; letter-spacing: 0.04em; font-weight: 400; }
</style>
</head>
<body>
  <div class="grid">
    <div class="row">
      <div>
        <div class="label">Calm out</div>
        <div class="meta">cubic-bezier(.2,.7,.2,1) · 220ms</div>
      </div>
      <div class="demo"><div class="ball b1"></div></div>
    </div>
    <div class="row-r">
      <div class="cap"><b>Default for UI.</b> Hovers, button lifts, panel opens. Nothing dramatic; just confident.</div>
    </div>
    <div class="row">
      <div>
        <div class="label">Bounce</div>
        <div class="meta">cubic-bezier(.34,1.56,.64,1) · 380ms</div>
      </div>
      <div class="demo"><div class="ball b2"></div></div>
    </div>
    <div class="row-r">
      <div class="cap"><b>Character entrances only.</b> Never for UI. A kid bounces; a button doesn't.</div>
    </div>
  </div>
</body>
</html>
