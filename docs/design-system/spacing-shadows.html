<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spacing — Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 28px 24px; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; align-items: end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 120px; height: 76px; background: #F5EDD6; border-radius: 8px; box-shadow: inset 0 0 0 1.5px #1A4A4A; }
  .b1 { box-shadow: inset 0 0 0 1.5px #1A4A4A, 0 1px 0 rgba(26,74,74,0.10); }
  .b2 { box-shadow: inset 0 0 0 1.5px #1A4A4A, 0 2px 0 #1A4A4A; }
  .b3 { box-shadow: inset 0 0 0 1.5px #1A4A4A, 0 4px 0 #1A4A4A; }
  .b4 { box-shadow: 0 2px 0 rgba(26,74,74,.18), 0 8px 24px rgba(26,74,74,.08), inset 0 0 0 1.5px #1A4A4A; background: #FBF6E5; }
  .name { font-family: var(--font-display); font-size: 16px; letter-spacing: 0.04em; color: var(--fg); }
  .meta { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-muted); text-align: center; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box b1"></div><div class="name">Hair lift</div><div class="meta">--sh-1</div></div>
    <div class="col"><div class="box b2"></div><div class="name">Drawn drop</div><div class="meta">--sh-2</div></div>
    <div class="col"><div class="box b3"></div><div class="name">Resting button</div><div class="meta">--sh-3</div></div>
    <div class="col"><div class="box b4"></div><div class="name">Soft card</div><div class="meta">--sh-card</div></div>
  </div>
</body>
</html>
