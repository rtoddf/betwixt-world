<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brand — Don'ts</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 18px 22px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .stage { width: 100%; aspect-ratio: 1.4 / 1; background: var(--bg-elevated); border-radius: 8px; box-shadow: var(--sh-inset); position: relative; display: grid; place-items: center; overflow: hidden; }
  .stage img { width: 56px; height: 56px; display: block; }
  .stage::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent calc(50% - 1px), #E8442A calc(50% - 1px), #E8442A calc(50% + 1px), transparent calc(50% + 1px));
    opacity: .85; pointer-events: none;
  }
  .stretch  img { transform: scaleX(1.6); }
  .rotate   img { transform: rotate(-18deg); }
  .recolor  img { filter: hue-rotate(220deg) saturate(.4); }
  .shadow   img { filter: drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  .lbl { font-size: 12px; color: var(--fg-muted); text-align: center; line-height: 1.35; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><div class="stage stretch"><img src="../assets/logo-icon-primary.svg" alt=""/></div><div class="lbl">Don't stretch</div></div>
    <div class="cell"><div class="stage rotate"><img src="../assets/logo-icon-primary.svg" alt=""/></div><div class="lbl">Don't rotate</div></div>
    <div class="cell"><div class="stage recolor"><img src="../assets/logo-icon-primary.svg" alt=""/></div><div class="lbl">Don't recolor</div></div>
    <div class="cell"><div class="stage shadow"><img src="../assets/logo-icon-primary.svg" alt=""/></div><div class="lbl">Don't drop-shadow</div></div>
  </div>
</body>
</html>
