<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Type — Hierarchy</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 24px 28px; box-sizing: border-box; }
  .eyebrow { font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: 0.2em; color: var(--bw-burnt); text-transform: uppercase; }
  .h1 { font-family: var(--font-display); font-size: 56px; line-height: 1.04; letter-spacing: 0.07em; color: var(--fg-display); margin: 6px 0 8px; }
  .lede { font-family: var(--font-body); font-size: 17px; font-weight: 500; line-height: 1.5; color: var(--fg); max-width: 56ch; }
  .meta { font-family: var(--font-body); font-size: 13px; color: var(--fg-muted); margin-top: 10px; }
</style>
</head>
<body>
  <div class="eyebrow">Issue No. 04 — Field Notes</div>
  <div class="h1">You've got neighbors.<br/>Now meet ours.</div>
  <div class="lede">A small introduction to the kids who live in Betwixt — what they carry, where they sit, and how to say hello.</div>
  <div class="meta">A note from the studio · 3 min read</div>
</body>
</html>
