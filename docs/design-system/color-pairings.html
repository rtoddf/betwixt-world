<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Colors — Pairings</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); font-family: var(--font-body); padding: 22px 24px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .pair { border-radius: 8px; padding: 18px 20px; min-height: 88px; box-sizing: border-box; box-shadow: var(--sh-inset); display: flex; flex-direction: column; justify-content: space-between; }
  .pair .h { font-family: var(--font-display); font-size: 22px; letter-spacing: 0.05em; line-height: 1.1; }
  .pair .b { font-size: 13px; line-height: 1.45; font-weight: 500; }
  .badge { display: inline-block; align-self: flex-start; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; font-weight: 700; }
  .aaa { background: rgba(26,74,74,.10); color: #1A4A4A; }
  .aaa-inv { background: rgba(245,237,214,.16); color: #F5EDD6; }
  .lg  { background: rgba(26,74,74,.10); color: #1A4A4A; }
</style>
</head>
<body>
  <div class="grid">
    <div class="pair" style="background:#F5EDD6;">
      <div>
        <div class="h" style="color:#1A4A4A;">Deep Navy on Cream</div>
        <div class="b" style="color:#1A4A4A;">All body copy lives here.</div>
      </div>
      <span class="badge aaa">AAA · all sizes</span>
    </div>
    <div class="pair" style="background:#1A4A4A;">
      <div>
        <div class="h" style="color:#F5EDD6;">Cream on Deep Navy</div>
        <div class="b" style="color:#F5EDD6;">Inverse surfaces, footers, quotes.</div>
      </div>
      <span class="badge aaa-inv">AAA · all sizes</span>
    </div>
    <div class="pair" style="background:#F5EDD6;">
      <div>
        <div class="h" style="color:#2A7F7F;">Teal on Cream</div>
        <div class="b" style="color:#1A4A4A;">Headings only — never below 24px.</div>
      </div>
      <span class="badge lg">Large text only</span>
    </div>
    <div class="pair" style="background:#2A7F7F;">
      <div>
        <div class="h" style="color:#F5EDD6;">Cream on Teal</div>
        <div class="b" style="color:#F5EDD6;">Hero panels, section breaks.</div>
      </div>
      <span class="badge aaa-inv">Large text only</span>
    </div>
  </div>
</body>
</html>
