<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brand — Primary Lockup</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 24px 28px; box-sizing: border-box; }
  .lock { display: flex; align-items: center; gap: 22px; }
  .lock img { width: 128px; height: 128px; display: block; }
  .wordmark { font-family: var(--font-display); font-size: 96px; line-height: 1; letter-spacing: 0.05em; color: var(--fg-display); }
  .tagline { font-family: var(--font-body); font-size: 16px; color: var(--fg-muted); margin-top: 10px; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="lock">
    <img src="../assets/logo-icon-primary.svg" alt="Betwixt mark" />
    <div>
      <div class="wordmark">Betwixt</div>
      <div class="tagline">You've got neighbors…now meet ours</div>
    </div>
  </div>
</body>
</html>
