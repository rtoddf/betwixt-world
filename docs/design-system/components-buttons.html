<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Components — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 26px 24px; box-sizing: border-box; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border: 0; padding: 12px 22px; border-radius: 8px; font-weight: 600; letter-spacing: 0.01em; line-height: 1; transition: transform 120ms cubic-bezier(.2,.7,.2,1), box-shadow 120ms; }
  .b-primary { background: #2A7F7F; color: #F5EDD6; box-shadow: 0 4px 0 #1A4A4A; }
  .b-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #1A4A4A; }
  .b-primary.is-pressed { transform: translateY(2px); box-shadow: 0 1px 0 #1A4A4A; }
  .b-secondary { background: #F5EDD6; color: #1A4A4A; box-shadow: inset 0 0 0 1.5px #1A4A4A, 0 2px 0 #1A4A4A; }
  .b-secondary:hover { transform: translateY(-2px); box-shadow: inset 0 0 0 1.5px #1A4A4A, 0 4px 0 #1A4A4A; }
  .b-coral { background: #E8442A; color: #F5EDD6; box-shadow: 0 4px 0 #1A4A4A; }
  .b-ghost { background: transparent; color: #1A4A4A; box-shadow: inset 0 0 0 1.5px rgba(26,74,74,.25); }
  .b-ghost:hover { box-shadow: inset 0 0 0 1.5px #1A4A4A; }
  .b-disabled { background: #ECDFB8; color: rgba(26,74,74,.45); box-shadow: inset 0 0 0 1.5px rgba(26,74,74,.18); cursor: not-allowed; }
  .lbl { font-size: 11px; color: var(--fg-muted); letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="lbl">Buttons — rest, hover (hover me), pressed, disabled</div>
  <div class="row">
    <button class="b-primary">Meet Worry</button>
    <button class="b-secondary">See the neighborhood</button>
    <button class="b-coral">Say hello</button>
    <button class="b-ghost">Read more</button>
    <button class="b-primary is-pressed">Pressed</button>
    <button class="b-disabled" disabled>Coming soon</button>
  </div>
</body>
</html>
