<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Colors — Primary</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 22px 24px; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .swatch { border-radius: 8px; box-shadow: var(--sh-inset); overflow: hidden; }
  .chip { height: 96px; }
  .label { padding: 10px 14px 12px; background: var(--bg-elevated); }
  .name { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.05em; color: var(--fg); }
  .hex { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--fg-muted); margin-top: 2px; }
  .role { font-size: 12px; color: var(--fg-muted); margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#2A7F7F"></div><div class="label"><div class="name">Teal</div><div class="hex">#2A7F7F</div><div class="role">Anchor · large headings, borders, UI surfaces</div></div></div>
    <div class="swatch"><div class="chip" style="background:#F0A500"></div><div class="label"><div class="name">Amber</div><div class="hex">#F0A500</div><div class="role">Decoration only · rings, icons, dividers</div></div></div>
    <div class="swatch"><div class="chip" style="background:#D4622A"></div><div class="label"><div class="name">Burnt Orange</div><div class="hex">#D4622A</div><div class="role">Decorative accent · eyebrows, frames</div></div></div>
  </div>
</body>
</html>
