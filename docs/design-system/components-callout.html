<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Components — Callout</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 22px 24px; box-sizing: border-box; }
  .callout { background: #1A4A4A; color: #F5EDD6; border-radius: 8px; padding: 22px 26px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 22px; box-shadow: 0 4px 0 rgba(26,74,74,.18); position: relative; overflow: hidden; }
  .callout::before { content: ""; position: absolute; right: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: #F0A500; opacity: .14; }
  .eye { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700; color: #F0A500; margin-bottom: 6px; }
  .h { font-family: var(--font-display); font-size: 28px; letter-spacing: 0.05em; line-height: 1.1; }
  .b { font-size: 14px; line-height: 1.5; margin-top: 4px; max-width: 46ch; color: rgba(245,237,214,.86); }
  .btn { background: #F0A500; color: #1A4A4A; padding: 11px 18px; border-radius: 8px; font-weight: 700; font-size: 14px; box-shadow: 0 3px 0 rgba(26,74,74,.55); border: 0; cursor: pointer; }
</style>
</head>
<body>
  <div class="callout">
    <div>
      <div class="eye">A note from the studio</div>
      <div class="h">Betwixt is a place, not an app.</div>
      <div class="b">We're building a small neighborhood you can walk through, one resident at a time.</div>
    </div>
    <button class="btn">Read the note</button>
  </div>
</body>
</html>
