<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brand — Lockup Variations</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-body); padding: 0; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; }
  .cell { padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 178px; box-sizing: border-box; }
  .cell img { width: 56px; height: 56px; display: block; }
  .wm { font-family: var(--font-display); font-size: 26px; letter-spacing: 0.05em; line-height: 1; }
  .caption { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; }
  .c-cream { background: #F5EDD6; } .c-cream .wm { color: #2A7F7F; } .c-cream .caption { color: #1A4A4A; opacity: .6; }
  .c-teal  { background: #2A7F7F; } .c-teal  .wm { color: #F5EDD6; } .c-teal  .caption { color: #F5EDD6; opacity: .7; }
  .c-mono  { background: #F5EDD6; } .c-mono  .wm { color: #2A7F7F; } .c-mono  .caption { color: #1A4A4A; opacity: .6; }
  .c-navy  { background: #1A4A4A; } .c-navy  .wm { color: #F5EDD6; } .c-navy  .caption { color: #F0A500; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell c-cream">
      <img src="../assets/logo-icon-primary.svg" alt="" />
      <div class="wm">Betwixt</div>
      <div class="caption">Full color · cream</div>
    </div>
    <div class="cell c-teal">
      <img src="../assets/logo-icon-on-teal.svg" alt="" />
      <div class="wm">Betwixt</div>
      <div class="caption">Full color · teal</div>
    </div>
    <div class="cell c-mono">
      <img src="../assets/logo-icon-mono-teal.svg" alt="" />
      <div class="wm">Betwixt</div>
      <div class="caption">Mono · teal on cream</div>
    </div>
    <div class="cell c-navy">
      <img src="../assets/logo-icon-on-navy.svg" alt="" />
      <div class="wm">Betwixt</div>
      <div class="caption">Reversed · on navy</div>
    </div>
  </div>
</body>
</html>
