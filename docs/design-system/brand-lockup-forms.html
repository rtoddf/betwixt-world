<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brand — Lockup Forms</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 22px 28px; box-sizing: border-box; }
  .row { display: grid; grid-template-columns: 1.4fr .9fr .9fr .6fr; gap: 22px; align-items: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .horiz { display: flex; align-items: center; gap: 14px; }
  .horiz img { width: 64px; height: 64px; }
  .stacked { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .stacked img { width: 60px; height: 60px; }
  .wm-lg { font-family: var(--font-display); font-size: 40px; letter-spacing: 0.05em; line-height: 1; color: var(--fg-display); }
  .wm-md { font-family: var(--font-display); font-size: 28px; letter-spacing: 0.05em; line-height: 1; color: var(--fg-display); }
  .wm-only { font-family: var(--font-display); font-size: 44px; letter-spacing: 0.06em; color: var(--fg-display); line-height: 1; }
  .ic img { width: 64px; height: 64px; }
  .lbl { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-muted); font-weight: 700; }
</style>
</head>
<body>
  <div class="row">
    <div class="col">
      <div class="horiz"><img src="../assets/logo-icon-primary.svg" alt=""/><div class="wm-lg">Betwixt</div></div>
      <div class="lbl">Primary · horizontal</div>
    </div>
    <div class="col">
      <div class="stacked"><img src="../assets/logo-icon-primary.svg" alt=""/><div class="wm-md">Betwixt</div></div>
      <div class="lbl">Stacked</div>
    </div>
    <div class="col">
      <div class="wm-only">Betwixt</div>
      <div class="lbl">Wordmark</div>
    </div>
    <div class="col">
      <div class="ic"><img src="../assets/logo-icon-primary.svg" alt=""/></div>
      <div class="lbl">Icon</div>
    </div>
  </div>
</body>
</html>
