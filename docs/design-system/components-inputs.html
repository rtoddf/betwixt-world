<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Components — Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 22px 24px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; max-width: 640px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 12px; font-weight: 600; color: #1A4A4A; letter-spacing: 0.04em; }
  input, select { font: inherit; font-size: 15px; padding: 11px 14px; border-radius: 8px; background: #FBF6E5; color: #1A4A4A; border: 0; box-shadow: inset 0 0 0 1.5px #1A4A4A; outline: none; }
  input::placeholder { color: rgba(26,74,74,.45); }
  input:focus { box-shadow: inset 0 0 0 1.5px #1A4A4A, 0 0 0 3px rgba(240,165,0,.55); }
  .help { font-size: 12px; color: rgba(26,74,74,.65); }
  .err input { box-shadow: inset 0 0 0 1.5px #E8442A; }
  .err .help { color: #E8442A; }
</style>
</head>
<body>
  <div class="grid">
    <div class="field">
      <label>Your name</label>
      <input type="text" placeholder="Worry, perhaps?" />
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" value="hello@betwixt.world" />
    </div>
    <div class="field err">
      <label>Neighborhood</label>
      <input type="text" value="not a real street" />
      <div class="help">We couldn't find that one. Try again?</div>
    </div>
    <div class="field">
      <label>Visit on</label>
      <select><option>Saturday afternoon</option></select>
    </div>
  </div>
</body>
</html>
