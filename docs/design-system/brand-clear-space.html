<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brand — Clear Space</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding: 22px 28px; box-sizing: border-box; }
  .row { display: flex; align-items: center; gap: 36px; }
  .frame { position: relative; padding: 36px; }
  .frame::before {
    content: ""; position: absolute; inset: 0;
    border: 1.5px dashed rgba(26,74,74,0.35); border-radius: 8px;
    pointer-events: none;
  }
  .x { position: absolute; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--fg-muted); }
  .x.t { top: 14px; left: 50%; transform: translateX(-50%); }
  .x.l { left: 14px; top: 50%; transform: translateY(-50%); }
  .frame img { width: 84px; height: 84px; display: block; }
  .meta { font-size: 13px; color: var(--fg-muted); line-height: 1.5; max-width: 280px; }
  .meta b { font-family: var(--font-display); color: var(--fg); font-size: 18px; letter-spacing: 0.05em; font-weight: 400; display: block; margin-bottom: 6px; }
  .meta code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--bg-elevated); padding: 1px 6px; border-radius: 4px; color: var(--fg); }
</style>
</head>
<body>
  <div class="row">
    <div class="frame">
      <span class="x t">x</span><span class="x l">x</span>
      <img src="../assets/logo-icon-primary.svg" alt="" />
    </div>
    <div class="meta">
      <b>Clear space</b>
      Reserve <code>x</code> on all sides, where <code>x</code> = ½ the mark's diameter. No type, image, or edge intrudes. <b style="display:inline;font-size:13px;">Minimum size:</b> the icon mark never appears smaller than <b style="display:inline;font-size:13px;">24px</b>; the horizontal lockup never below <b style="display:inline;font-size:13px;">96px</b> wide.
    </div>
  </div>
</body>
</html>
